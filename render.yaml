services:
  - type: web
    name: jiaveri-jobs
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: 9999999999
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 3000
    disk:
      name: jiaveri-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
